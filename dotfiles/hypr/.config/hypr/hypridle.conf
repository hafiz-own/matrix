# Timeouts count from the last activity. Opening the fullscreen screensaver
# counts as activity (pointer enter on the new window), so at 2:30 every
# timer restarts; the later steps happen 2:30 after their own timeout:
#
#   2:00  dim to 10%            (restored on activity)
#   2:30  matrix screensaver    (stopped on real activity)
#   6:30  lock (pauses media)   (240s after the screensaver)
#   8:00  display off           (330s after the screensaver)
#  17:30  hibernate — on battery only
#  32:30  suspend   — on AC only
#
# The screensaver window is excluded from the "fullscreen inhibits idle"
# window rule, otherwise the chain would stop at the screensaver.
# Caffeine (waybar ☕) holds a systemd idle inhibitor, which hypridle honours.

general {
    # The one lock path: pause media, wait for an exiting hyprlock, lock.
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session    # lock before suspend/hibernate
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # avoid pressing a key twice to wake the display
}

# 1. Dim
listener {
    timeout = 120                                # 2min
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh dim
    on-resume = ~/.config/hypr/scripts/idle-dim.sh restore
}

# 2. Screensaver
listener {
    timeout = 150                                # 2.5min
    on-timeout = ~/.config/matrix/scripts/matrix-screensaver.sh start
    on-resume = ~/.config/matrix/scripts/matrix-screensaver.sh stop
}

# 3. Lock (through logind so lock_cmd runs: media pause + hyprlock)
listener {
    timeout = 240                                # 4min
    on-timeout = loginctl lock-session
}

# 4. Screen off (DPMS)
listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5. Hibernate on battery
listener {
    timeout = 900                                # 15min
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh battery
}

# 6. Suspend on AC
listener {
    timeout = 1800                               # 30min
    on-timeout = ~/.config/hypr/scripts/idle-sleep.sh ac
}
