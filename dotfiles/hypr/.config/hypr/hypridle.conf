# All timeouts count from the last user input; they do not chain.
# A fullscreen screensaver window is not input, so it does not reset them.
#
#   2:00  dim to 10%            (restored on activity)
#   2:30  matrix screensaver    (stopped on activity)
#   4:00  lock (pauses media)
#   5:30  display off
#  15:00  hibernate — on battery only; on AC stay locked with the display off
#
# Caffeine (waybar ☕) holds a systemd idle inhibitor, which hypridle honours.

general {
    # Pause media, then lock; never start a second hyprlock.
    lock_cmd = playerctl --all-players pause 2>/dev/null; mpc -q pause 2>/dev/null; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend/hibernate
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # avoid pressing a key twice to wake the display
}

# 1. Dim
listener {
    timeout = 120                                # 2min
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh dim
    on-resume = ~/.config/hypr/scripts/idle-dim.sh restore
}

# 2. Screensaver
listener {
    timeout = 150                                # 2.5min
    on-timeout = ~/.config/matrix/scripts/matrix-screensaver.sh start
    on-resume = ~/.config/matrix/scripts/matrix-screensaver.sh stop
}

# 3. Lock (through logind so lock_cmd runs: media pause + hyprlock)
listener {
    timeout = 240                                # 4min
    on-timeout = loginctl lock-session
}

# 4. Screen off (DPMS)
listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5. Hibernate on battery (on AC: nothing beyond lock + display off)
listener {
    timeout = 900                                # 15min
    on-timeout = ~/.config/hypr/scripts/idle-hibernate.sh
}
