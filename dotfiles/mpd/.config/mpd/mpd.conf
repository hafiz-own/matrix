music_directory     "~/Music/some_good_time"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"
log_file            "~/.config/mpd/mpd.log"

audio_output {
    type    "pulse"
    name    "PipeWire Output"
}

audio_output {
    type            "fifo"
    name            "Visualizer"
    path            "/tmp/mpd.fifo"
    format          "44100:16:2"
}

audio_output {
    type            "httpd"
    name            "HTTP Stream"
    encoder         "lame"
    port            "8000"
    bitrate         "192"
    format          "44100:16:2"
    always_on       "yes"
    bind_to_address "0.0.0.0"
}

auto_update         "yes"
auto_update_depth   "0"
replaygain          "album"
