# Applies to every rclone-*.service (systemd prefix drop-in), including
# mounts created later by matrix-setup-rclone.sh on a new machine.

[Unit]
# Give up after 5 failed starts in 10 min (e.g. expired token) instead of
# retrying forever; retries back off from 30 s up to 10 min.
StartLimitIntervalSec=10min
StartLimitBurst=5

[Service]
RestartSec=30
RestartSteps=5
RestartMaxDelaySec=10min
# Desktop notification on the first failed start, and when it recovers
ExecStartPost=%h/.config/matrix/scripts/matrix-unit-alert ok %n
ExecStopPost=%h/.config/matrix/scripts/matrix-unit-alert failed %n
