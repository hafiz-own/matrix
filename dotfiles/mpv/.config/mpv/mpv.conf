# -----------------------------------------------------
# Matrix MPV Configuration
# -----------------------------------------------------

# --- GPU / Hardware Acceleration ---
# High-quality rendering (gpu-hq is the old name of this profile)
profile=high-quality
# Render and decode on the Intel iGPU that drives the display. Left alone,
# libplacebo picks the discrete NVIDIA MX550: ~1.6s to wake it and create
# the Vulkan device, every frame copied back to the iGPU, and the dGPU kept
# awake (CPU 55% / 458 MB vs 12% / 200 MB on Intel for the same clip).
vulkan-device='Intel(R) Iris(R) Xe Graphics (ADL GT2)'
# Intel VA-API, zero-copy into Vulkan. No auto-safe: its fallback is
# nvdec(-copy), which wakes the NVIDIA GPU; unsupported codecs use software.
hwdec=vaapi

# --- UOSC Integration ---
# Disable default OSC to avoid conflicts with UOSC
osc=no
# Required for UOSC borderless mode
osd-bar=no
border=no

# --- Quality of Life ---
# Remember playback position
save-position-on-quit=yes
# Close window when playlist is exhausted (default auto-close behavior)
keep-open=no
# Start in center of screen
geometry=50%:50%
# Limit maximum volume (can boost quiet audio)
volume-max=150

# --- Subtitle Styling ---
sub-font="Inter"
sub-font-size=40
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#000000"

# --- YouTube-DL / Yt-dlp Integration ---
# Fetch best video format <= 1440p (or 1080p if you prefer) and best audio
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
