general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/Pictures/Me/profile.png   # only png supported for now
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(000000)
    inner_color = rgb(000000)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = true
    rounding = 40 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -200
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME" 
    color = rgba(102,0,204, 1.0)
    font_size = 55
    font_family = Knight Warrior
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    # battery status
    text = cmd[update:2000] echo "$(cat /sys/class/power_supply/BAT0/status)     $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(180,120,255, 0.9)
    font_size = 24
    font_family = Knight Warrior
    position = -100, 20
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 6
}


label {
    monitor =
    text = Just Trying !
    color = rgba(255, 0, 50, 1.0)
    font_size = 20
    font_family = Hyper Oxide
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = $HOME/Pictures/wallpapers/dp1.png
    size = 200 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 4
    border_color = rgb(128,0,128)
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#   reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}


label {
    monitor =
    text = cmd[update:1000] mpc | grep -q '\[playing\]' && mpc current --format '%title%' || echo ""
    font_size = 20
    font_family = JetBrains Mono Bold, Jameel Noori Kasheeda
    color = rgba(255, 255, 255, 0.9)
    position = 0, -300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] mpc | grep -q '\[playing\]' && mpc current --format '%artist%' || echo ""
    font_size = 14
    font_family = JetBrains Mono, Jameel Noori Kasheeda
    color = rgba(255, 255, 255, 0.6)
    position = 0, -330
    halign = center
    valign = center
}


label {
    monitor =
	text = cmd[update:1000] python3 ~/.config/hypr/scripts/lrcsync.py --plain
    font_size = 16
    font_family = JetBrains Mono, Jameel Noori Kasheeda
    color = rgba(255, 255, 255, 0.75)
    position = 0, -390
    halign = center
    valign = center
}

fingerprint {
    enabled = true
    ready_message = Touch the fingerprint sensor
    present_message = Scanning...
    error_message = Fingerprint not recognized
}
